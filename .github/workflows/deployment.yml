name: Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Modify .env Variable
        run: |
          rm .env
          echo "NEXT_PUBLIC_API_URL=https://api.relaxzeal.com/shop-api" >> .env
          echo "NEXT_PUBLIC_RAZORPAY_ID=rzp_test_9hxZ5fXHRRjg0Y" >> .env

      - name: Check for Changes in package.json
        id: check-package-json
        run: |
          git log -n 1 --name-only --format=format: | grep package.json

      - name: Run NPM Script
        run: |
          if [[ "${{ steps.check-package-json.outputs.stdout }}" == "package.json" ]]; then
            npm run prod-nm
          else
            npm run prod
          fi
          pwd
          ls

      - name: Upload to Server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sg1-ts106.a2hosting.com
          username: relaxzea
          password: ${{ secrets.PASSWORD }}
          local-dir: /zeal-app.tar.gz
          server-dir: /home/relaxzea/app.relaxzeal.com/

      - name: Run Command on Server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: sg1-ts106.a2hosting.com
          username: relaxzea
          password: ${{ secrets.PASSWORD }}
          port: 7822
          script: |
            cd app.relaxzeal.com
            tar -xvf zeal-app.tar.gz
            pkill -u relaxzea