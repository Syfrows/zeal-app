name: Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Replace Enviroment variables
        run: |
          rm .env
          echo "NEXT_PUBLIC_API_URL=https://api.relaxzeal.com/shop-api" >> .env
          echo "NEXT_PUBLIC_RAZORPAY_ID=rzp_test_9hxZ5fXHRRjg0Y" >> .env

      - name: Check For New Node Module
        id: check-new-node-module
        run: |
          echo "NEW_NODE_MODULE=$(git diff --name-only $GITHUB_SHA^ $GITHUB_SHA | grep 'package-lock.json')" >> "$GITHUB_OUTPUT"

      - name: Build & Package
        run: |
          if [[ "${{ steps.check-new-node-module.outputs.NEW_NODE_MODULE}}" == "package-lock.json" ]]; then
            npm run prod-nm
          else
            npm run prod
          fi

      - name: Upload Package To Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: sg1-ts106.a2hosting.com
          username: relaxzea
          key: ${{ secrets.KEY }}
          port: 7822
          source: "zeal-app.tar.gz"
          target: /home/relaxzea/app.relaxzeal.com/

      - name: Extract Application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: sg1-ts106.a2hosting.com
          username: relaxzea
          key: ${{ secrets.KEY }}
          port: 7822
          script: |
            cd app.relaxzeal.com
            tar -xvf zeal-app.tar.gz
            pkill -u relaxzea
            
